version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=user_interviews
    depends_on:
      - db
    volumes:
      - .:/app
    command: npm run dev

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: user_interviews
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./user-interviews.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: